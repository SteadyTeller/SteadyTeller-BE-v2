# 로컬 Podman MySQL 컨테이너로 실제 MySQL 제약조건(FK 등)을 검증하기 위한 테스트용 프로필.
#
# 실행 방법:
#   podman run -d --name steadyteller-mysql \
#     -e MYSQL_ROOT_PASSWORD=steadyroot \
#     -e MYSQL_DATABASE=steadyteller \
#     -e MYSQL_USER=steadyteller \
#     -e MYSQL_PASSWORD=steadypass \
#     -p 3306:3306 docker.io/library/mysql:8.0
#   ./gradlew bootRun --args='--spring.profiles.active=mysql'

spring.datasource.url=jdbc:mysql://localhost:3306/steadyteller?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=steadyteller
spring.datasource.password=steadypass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.ai.google.genai.api-key=${GEMINI_API_KEY:default-key}
spring.ai.google.genai.chat.options.model=gemini-3.6-flash

app.jwt.secret=c3RlYWR5dGVsbGVyLWRldmVsb3BtZW50LXNlY3JldC1rZXktMjAyNg==
app.jwt.access-token-expiration-millis=3600000
app.cors.allowed-origins=http://localhost:5173
