spring:
  application:
    name: SteadyTeller-BE

  profiles:
    active: dev

# Member 도메인(로그인/토큰 발급)을 담당하는 팀원과 동일한 값을 공유해야 함 (HS256, subject=memberId 가정)
jwt:
  secret: ${JWT_SECRET:temporary-dev-secret-please-change-this-value-32-bytes-min}

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:default-key}
        chat:
          options:
            model: gemini-3.6-flash

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:steadyteller}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.6-flash
